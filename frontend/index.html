<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dental Records</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="static/css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/">
          <i class="fas fa-tooth"></i> Dental Records
        </a>
      </div>
    </nav>

    <div class="hero-section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8 text-center">
            <h1 class="display-4 mb-4">Welcome to Dental Records</h1>
            <p class="lead mb-5">
              Experience the future of dental care. Streamlined appointments,
              digital records, and personalized care.
            </p>

            <div class="card shadow-lg">
              <div class="card-body p-5">
                <h3 class="card-title mb-4">Get Started</h3>

                <div id="alert-container"></div>

                <button
                  type="button"
                  class="btn btn-primary btn-lg demo-login-btn w-100"
                  id="demoLoginBtn"
                >
                  <span
                    class="spinner-border spinner-border-sm me-2 d-none"
                    id="demoLoginSpinner"
                  ></span>
                  Try Demo Account
                </button>

                <hr class="my-4" />

                <div class="row g-3">
                  <div class="col-12 col-md-6">
                    <a href="/login" class="btn btn-outline-primary btn-lg w-100">
                      <i class="fas fa-sign-in-alt me-2"></i>Login to Your Account
                    </a>
                  </div>
                  <div class="col-12 col-md-6">
                    <a href="/register" class="btn btn-outline-primary btn-lg w-100">
                      <i class="fas fa-user-plus me-2"></i>Create New Account
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="bg-dark text-light py-4 mt-5">
      <div class="container text-center">
        <p>&copy; 2024 Dental Records. All rights reserved.</p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://kit.fontawesome.com/your-fontawesome-kit.js"
      crossorigin="anonymous"
    ></script>
    <script src="static/js/app.js"></script>
    <script src="static/js/auth.js"></script>
  </body>
</html>
